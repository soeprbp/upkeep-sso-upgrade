              - generic [ref=e424]:
                - paragraph [ref=e425]: Hi team,
                - paragraph [ref=e426]: We are beginning an UpKeep authentication upgrade that moves users from local passwords to Microsoft Entra ID single sign-on.
                - paragraph [ref=e427]: The goal is to make access easier for users, improve security by using company-managed credentials, and reduce the long-term support burden tied to password resets and account maintenance.
                - paragraph [ref=e428]: We are handling this as a phased rollout rather than a single cutover so we can validate the technical configuration, support the pilot group closely, and reduce disruption.
                - paragraph [ref=e429]: During the rollout, users will receive clear instructions before their turn, and we will keep native login available until the pilot and wave testing are stable.
                - paragraph [ref=e430]: The key success factors are accurate account matching, a clear help path for users, and a controlled final cutover once the pilot confirms the flow is working as expected.
                - paragraph [ref=e431]: We will share progress updates as the rollout moves through pilot, waves, and final cutover.
              - generic [ref=e432]: "Tone: brief, business-oriented, and confidence-building."
