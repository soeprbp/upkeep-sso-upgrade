                  - text: UpKeep is moving to Microsoft Entra ID sign-in
                - generic [ref=e363]:
                  - strong [ref=e364]: "Preheader:"
                  - text: Here is what is changing, when it starts, and what you need to do if you use UpKeep.
              - paragraph [ref=e365]: This version introduces the rollout, explains the shift to Welch sign-in, and sets expectations for the phased cutover.
              - generic [ref=e366]:
                - paragraph [ref=e367]: Hi team,
                - paragraph [ref=e368]: We are upgrading UpKeep sign-in to Microsoft Entra ID single sign-on (SSO). Going forward, you will use your Welch work account to access UpKeep instead of a separate UpKeep password.
                - paragraph [ref=e369]: The change will happen in phases over the next two weeks. A small pilot group will test the new sign-in flow first, then we will move the rest of the users in waves before the final cutover.
                - paragraph [ref=e370]: "What this means for you:"
                - paragraph [ref=e371]: Use Continue with SSO and your Welch email address when you sign in to UpKeep.
                - paragraph [ref=e372]: If you use the mobile app, you may be asked for the company ID provided by IT.
                - paragraph [ref=e373]: If you are in a later rollout wave, you will receive a follow-up message with your specific timing and any extra steps.
                - paragraph [ref=e374]: We will keep native password login available during testing and the pilot period. Once the rollout is complete, UpKeep will use SSO only.
                - paragraph [ref=e375]: If you have trouble signing in or your account uses a non-Welch email address, please contact the helpdesk.
                - paragraph [ref=e376]: Thanks for your patience while we make this transition.
              - generic [ref=e377]: "Tone: straightforward, reassuring, and concise."
